<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <img src="logo.png" class="logo">
    </nav>
        
    <!-- Tombol jenis pajak -->
    <div id="home">
        <p style="margin-right: 15px; color: #000;">Jenis Pajak</p>

        <div id="btncontainer">
            <div id="slider"></div>
            <button id="butptkp">PTKP</button>
            <button id="butpbb">PBB</button>
        </div>
    </div> 

    <!-- div mainbox untuk halaman utama -->
    <div id="mainbox">
        <!-- div container pajak untuk mengumpulkan box ptkp dan box pbb menjadi satu -->
            <div id="containerpajak">
                <!-- div box ptkp untuk mencakup isi yang dibutuhkan untuk perhitungan pajak ptkp -->
                <div id="boxptkp">
                    <!-- div class form untuk menjaga teks dan input field berada dalam satu baris -->
                    <div class="form">
                        <p>Pilih status PTKP Anda:</p>
                        <!-- select ptkp untuk digunakan dalam javascript -->
                        <select id="ptkp" class="theinput">
                            <option value="" disabled selected hidden>Status PTKP</option>
                            <option value="TK/0">TK/0 (Rp 54.000.000)</option>
                            <option value="TK/1">TK/1 (Rp 58.500.000)</option>
                            <option value="TK/2">TK/2 (Rp 63.000.000)</option>
                            <option value="TK/3">TK/3 (Rp 67.500.000)</option>
                            <option value="K/0">K/0 (Rp 58.500.000)</option>
                            <option value="K/1">K/1 (Rp 63.000.000)</option>
                            <option value="K/2">K/2 (Rp 67.500.000)</option>
                            <option value="K/3">K/3 (Rp 72.000.000)</option>
                            <option value="K/I/0">K/I/0 (Rp 112.500.000)</option>
                            <option value="K/I/1">K/I/1 (Rp 117.000.000)</option>
                            <option value="K/I/2">K/I/2 (Rp 121.500.000)</option>
                            <option value="K/I/3">K/I/3 (Rp 126.000.000)</option>
                        </select>
                    </div>    

                    <div class="form">
                        <p>Masukkan penghasilan bulanan Anda:</p>
                        <input type="text" id="income" class="theinput">
                    </div>

                    <div class="form">
                        <p>Masukkan jumlah tunjangan Anda:</p>
                        <input type="text" id="tunjangan" class="theinput">
                    </div>

                    <div class="form">
                        <p>Masukkan jumlah bonus Anda:</p>
                        <input type="text" id="bonus" class="theinput">
                    </div>
                    <button onclick="calculateTax()">Hitung Pajak</button>
                </div>

                <!-- div box pbb untuk mencakup isi yang dibutuhkan untuk perhitungan pajak bumi dan bangunan -->
                <div id="boxpbb">
                    <div class="form">
                        <p>Pilih jenis PBB anda:</p>

                        <!-- statpbb untuk digunakan dalam javascrip -->
                        <select value="statpbb" class="theinput">
                            <option value="" disabled selected hidden>Jenis PBB</option>
                            <option value="p2">PBB P2</option>
                            <option value="p5l">PBB P5L</option>
                        </select>
                    </div>
                    
                    <div class="form">
                        <p>Masukkan nilai NJOP:</p>
                        <input type="text" id="NJKP" class="theinput">
                    </div>
                    
                    <div class="form">
                        <p>Masukkan nilai NJOPTKP:</p>
                        <input type="text" id="NJOPTKP" class="theinput">
                    </div>

                    <div class="form">
                        <p>Masukkan nilai Tarif NJKP(khusus p5l):</p>
                        <input type="text" id="tarifNJKP" class ="theinput">
                    </div>

                    <div class="form">
                        <p>Masukkan nilai Tarif PBB:</p>
                        <input type="text" id="tarifPBB" class="theinput">
                    </div>

                    <button onclick="">Hitung Pajak</button>
                </div>
        </div>

        <!-- result untuk menampilkan hasil perhitungan -->
        <p id="result"></p>
    </div>

    <script src="mechanisms.js"></script>
</body>
</html>
