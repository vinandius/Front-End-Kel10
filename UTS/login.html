<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Rendang</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/pages.css">
    <link rel="stylesheet" href="CSS/annoyingStyle.css">
</head>
<body>
    <main class="card">
        <h1>Masuk</h1>
        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" required>
            <p id="msg" class="msg"></p>
            <button type="submit" class="btn-add">Masuk</button>
        </form>
        <p class="alt">Belum punya akun? <a href="register.html">Daftar</a> | <a href="toko.html">Kembali</a></p>
    </main>
    <script src="JS/db.js"></script>
    <script src="JS/auth.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", e => {
            e.preventDefault();
            const ok = login(
                document.getElementById("email").value.trim(),
                document.getElementById("password").value
            );
            if (!ok) {
                document.getElementById("msg").textContent = "Email atau password salah.";
                return;
            }
            window.location.href = getCurrentUser().role === "admin" ? "admin.html" : "index.html";
        });
    </script>
</body>
</html>
