<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Rendang</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/pages.css">
    <link rel="stylesheet" href="CSS/annoyingStyle.css">
</head>
<body>
    <main class="card">
        <h1>Daftar</h1>
        <form id="registerForm">
            <label for="name">Nama</label>
            <input type="text" id="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <label for="password">Password (minimal 6 karakter)</label>
            <input type="password" id="password" minlength="6" required>
            <p id="msg" class="msg"></p>
            <button type="submit" class="btn-add">Daftar</button>
        </form>
        <p class="alt">Sudah punya akun? <a href="login.html">Masuk</a> | <a href="toko.html">Kembali</a></p>
    </main>
    <script src="JS/db.js"></script>
    <script src="JS/auth.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", e => {
            e.preventDefault();
            const ok = register(
                document.getElementById("name").value.trim(),
                document.getElementById("email").value.trim(),
                document.getElementById("password").value
            );
            if (!ok) {
                document.getElementById("msg").textContent = "Email sudah terdaftar.";
                return;
            }
            alert("Pendaftaran berhasil. Silakan masuk.");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
