<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajak</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            background: #242526;
        }

        p{
            font-size: 18px;
            color: #e4e6eb;
        }

        select{
            font-size: 15px; 
            border-radius: 10px 10px 10px 10px; 
            width: 278px;
            height: 50px;
            border-color: rgba(0, 0, 0, 0.4);
            background-color: rgba(255,255,255,0.4);;   
        }

        select:focus{
            outline: none;
            box-shadow: 0 0 10px #e4e6eb;
            border-color: #e4e6eb;
            transition: box-shadow.15s ease, border-color.15s ease;
        }

        input { 
            width: 272px;
            height: 50px;
            margin : 10px 0;
            font-size: 15px; 
            text-align: left;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.4);
            border-width: 1.4px;
            background-color: rgba(255,255,255,0.4);
        }

        input:focus{
            outline: none;
            box-shadow: 0 0 10px #e4e6eb;
            border: 1px solid #e4e6eb;
            transition: box-shadow.15s ease, border-color.15s ease;
        }

        button{
            display: block; 
            margin: 20px auto; 
            padding: 10px 20px; 
            font-size: 15px;
            background-color: rgba(255,255,255,0.4);
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.4)
        }
    </style>
</head>
<body>
    <div style="width: 1000px; height: 700px; background-color: rgba(255,255,255,0.01); backdrop-filter: blur(10px) saturate (180%); border-radius: 10px; padding: 20px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.1); margin: 50px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.15);">
        <h1 style="text-align: center; color: #e4e6eb;">Kalkulator Pajak</h1>

        <div style="width: 750px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <p>Pilih status PTKP Anda:</p>
                <select id="ptkp">
                    <option value="" disabled selected hidden>Status PTKP</option>
                    <option value="TK/0">TK/0 (Rp 54.000.000)</option>
                    <option value="TK/1">TK/1 (Rp 58.500.000)</option>
                    <option value="TK/2">TK/2 (Rp 63.000.000)</option>
                    <option value="TK/3">TK/3 (Rp 67.500.000)</option>
                    <option value="K/0">K/0 (Rp 58.500.000)</option>
                    <option value="K/1">K/1 (Rp 63.000.000)</option>
                    <option value="K/2">K/2 (Rp 67.500.000)</option>
                    <option value="K/3">K/3 (Rp 72.000.000)</option>
                    <option value="K/I/0">K/I/0 (Rp 112.500.000)</option>
                    <option value="K/I/1">K/I/1 (Rp 117.000.000)</option>
                    <option value="K/I/2">K/I/2 (Rp 121.500.000)</option>
                    <option value="K/I/3">K/I/3 (Rp 126.000.000)</option>
                </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p>Masukkan penghasilan bulanan Anda:</p>
                <input type="text" id="income" class="theinput">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p>Masukkan jumlah tunjangan Anda:</p>
                <input type="text" id="tunjangan" class="theinput">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p>Masukkan jumlah bonus Anda:</p>
                <input type="text" id="bonus" class="theinput">
            </div>
        </div>
        <button onclick="calculateTax()" style="display: block; margin: 20px auto; padding: 10px 20px; font-size: 16px;">Hitung Pajak</button>

        <p id="result" style="text-align: center; font-size: 18px;"></p>
    </div>

    <script>
        function calculateTax(){
            const ptkp = document.getElementById('ptkp').value;
            const income = document.getElementById('income').value;
            const tunjangan = document.getElementById('tunjangan').value;
            const bonus = document.getElementById('bonus').value;
            const bruto = (parseFloat(income) + parseFloat(tunjangan) + parseFloat(bonus)) * 12;
            const iuran = bruto * 0.02;
            const bpjs = bruto * 0.02;
            let biayaJabatan = bruto * 0.05;
            if (biayaJabatan > 6000000) {
                biayaJabatan = 500000;
            }
            const neto = bruto - biayaJabatan;
            let pkp = 0;
                if (ptkp == "TK/0"){
                    pkp = neto - 54000000;
                } else if (ptkp == "TK/1"){
                    pkp = neto - 58500000;
                } else if (ptkp == "TK/2"){
                    pkp = neto - 63000000;
                } else if (ptkp == "TK/3"){
                    pkp = neto - 67500000;
                } else if (ptkp == "K/0"){
                    pkp = neto - 58500000;
                } else if (ptkp == "K/1"){
                    pkp = neto - 63000000;
                } else if (ptkp == "K/2"){
                    pkp = neto - 67500000;
                } else if (ptkp == "K/3"){
                    pkp = neto - 72000000;
                } else if (ptkp == "K/I/0"){
                    pkp = neto - 112500000;
                } else if (ptkp == "K/I/1"){
                    pkp = neto - 117000000;
                } else if (ptkp == "K/I/2"){
                    pkp = neto - 121500000;
                } else if (ptkp == "K/I/3"){
                    pkp = neto - 126000000;
                }
            
            let tarif = 0;
            if (pkp <= 60000000){
                tarif = 0.05;
            }
            else if (pkp > 60000000 <= 250000000){
                tarif = 0.15;
            }
            else if (pkp > 250000000 <= 500000000){
                tarif = 0.25;
            }
            else if (pkp > 500000000 <= 5000000000){
                tarif = 0.30;
            }
            else if (pkp > 5000000000){
                tarif = 0.35;
            }
            let pph = pkp * tarif;

            let formangka = new Intl.NumberFormat('id-ID');

            console.log("income: " + income);
            console.log("tunjangan: " + tunjangan);
            console.log("bonus: " + bonus);
            console.log("bruto: " + bruto);
            console.log("biaya jabatan: " + biayaJabatan);
            console.log("neto: " + neto);
            console.log("pkp: " + pkp);
            console.log("tarif: " + tarif);

            document.getElementById('result').innerText = "Pajak yang harus dibayar: Rp " + formangka.format(pph) + " dalam setahun";
        }
    </script>
</body>
</html>
